name: Shellcheck

on:
  push:
    paths:
      - "scripts/**"
  pull_request:
    paths:
      - "scripts/**"

jobs:
  shellcheck:
    name: Lint bash scripts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Reject non-ASCII characters in bash scripts
        run: |
          if grep -RIn --include='*.sh' '[^ -~[:space:]]' ./scripts; then
            echo "Found non-ASCII characters in bash scripts. Replace smart/unicode quotes with plain ASCII."
            exit 1
          fi

      - name: Run shellcheck on all scripts
        uses: ludeeus/action-shellcheck@master
        with:
          scandir: "./scripts"
          severity: warning