# nginx virtual host configuration.
#
# WHY this file?
#   nginx reads config files from /etc/nginx/conf.d/ at startup.
#   Instead of editing the default config in place, we drop our own
#   file here. This is the standard pattern for managing nginx sites.
#
# HOW nginx config works:
#   server {}     → one virtual host (one website)
#   listen        → which port to accept connections on
#   server_name   → which hostname this block responds to
#   location {}   → rules for specific URL paths

server {
    listen 80;
    server_name _;    # _ means "match any hostname"

    root /var/www/html;
    index index.html;

    # Access and error logs — journalctl can read these via systemd
    access_log /var/log/nginx/access.log;
    error_log  /var/log/nginx/error.log;

    location / {
        try_files $uri $uri/ =404;
    }

    # Health check endpoint — used by our monitor script
    location /health {
        return 200 "OK\n";
        add_header Content-Type text/plain;
    }
}