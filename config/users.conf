# users.conf ג€” defines which users to create on each VM.
#
# WHY a config file instead of hardcoding users in the script?
#   Separation of concerns: the script knows HOW to create users,
#   this file knows WHO to create. To add a new user you edit this
#   file only ג€” the script stays unchanged.
#
# FORMAT: username:group:shell:sudo
#   username  ג†’ the Linux username
#   group     ג†’ primary group (created if it doesn't exist)
#   shell     ג†’ login shell (/bin/bash or /sbin/nologin for service accounts)
#   sudo      ג†’ yes = full sudo access, no = no sudo

devops:devops:/bin/bash:yes
appuser:appuser:/bin/bash:no