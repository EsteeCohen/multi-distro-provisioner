# users.conf — defines which users to create on each VM.
#
# WHY a config file instead of hardcoding users in the script?
#   Separation of concerns: the script knows HOW to create users,
#   this file knows WHO to create. To add a new user you edit this
#   file only — the script stays unchanged.
#
# FORMAT: username:group:shell:sudo
#   username  → the Linux username
#   group     → primary group (created if it doesn't exist)
#   shell     → login shell (/bin/bash or /sbin/nologin for service accounts)
#   sudo      → yes = full sudo access, no = no sudo

devops:devops:/bin/bash:yes
appuser:appuser:/bin/bash:no